<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3RDS TEAM</title>
<style>
  :root{
    --ink:#171a21;--board:#eceef3;--surface:#fff;--line:#dfe3ea;--line-soft:#eaedf2;
    --text:#1d2129;--text-dim:#6b7280;--text-faint:#98a0ad;
    --accent:#5b57d8;--accent-soft:#ecebfb;
    --low:#1f9d63;--low-bg:#e6f5ee;--med:#d98a1f;--med-bg:#fbf1df;--high:#d8483f;--high-bg:#fbe9e7;
    --shadow:0 1px 2px rgba(20,25,35,.06),0 4px 14px rgba(20,25,35,.05);
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --topbar:58px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:var(--sans);background:var(--board);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:14px}

  /* Top bar */
  header.topbar{
    height:var(--topbar);display:flex;align-items:center;gap:18px;padding:0 18px;
    background:#fff;color:var(--text);border-bottom:1px solid var(--line);position:relative;z-index:40;
  }
  .brand{display:flex;flex-direction:column;line-height:1.12}
  .brand b{font-size:15px;font-weight:750;letter-spacing:.4px;color:var(--text)}
  .brand span{font-size:10px;color:var(--text-faint);letter-spacing:.4px;text-transform:uppercase}
  .stats{display:flex;gap:20px}
  .stat{display:flex;flex-direction:column;line-height:1.1}
  .stat b{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--text)}
  .stat span{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px}
  .spacer{flex:1}
  .search{display:flex;align-items:center;background:#f1f3f7;border:1px solid var(--line);border-radius:9px;padding:5px 9px;gap:7px}
  .search input{background:transparent;border:0;color:var(--text);outline:none;width:130px}
  .search input::placeholder{color:var(--text-faint)}
  .btn{border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:550;background:#fff;color:var(--text-dim);transition:.12s;white-space:nowrap}
  .btn:hover{background:#f6f7f9;color:var(--text)}
  .btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.solid:hover{background:#4a46c9}
  .sync{font-size:10.5px;font-weight:650;padding:4px 9px;border-radius:20px;white-space:nowrap;border:1px solid var(--line)}
  .sync.local{color:var(--text-dim);background:#f1f3f7}
  .sync.live{color:var(--low);background:var(--low-bg);border-color:#cdeede}
  .sync.saving{color:var(--med);background:var(--med-bg);border-color:#f0e2c0}
  .sync.off{color:var(--high);background:var(--high-bg);border-color:#f0cfcb}
  .tabs{display:none}

  /* Board fills the rest of the viewport */
  .board{height:calc(100% - var(--topbar));display:flex;gap:12px;padding:12px;align-items:stretch;overflow-x:auto}
  .col{
    flex:1 1 0;min-width:255px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
  }
  .col-head{padding:12px 13px 11px;border-bottom:1px solid var(--line-soft)}
  .row1{display:flex;align-items:center;gap:6px}
  .member-name{
    font-size:15px;font-weight:650;letter-spacing:-.2px;flex:1;border:1px solid transparent;border-radius:7px;
    padding:3px 5px;margin:-3px -5px;background:transparent;color:var(--text);outline:none;min-width:0;
  }
  .member-name:focus{border-color:var(--accent);background:#fff}
  .col-tools{display:flex;gap:1px;opacity:0;transition:opacity .12s}
  .col:hover .col-tools{opacity:1}
  .icon-btn{border:0;background:transparent;color:var(--text-faint);border-radius:7px;width:26px;height:26px;display:grid;place-items:center;padding:0}
  .icon-btn:hover{background:var(--line-soft);color:var(--text)}
  .icon-btn.danger:hover{background:var(--high-bg);color:var(--high)}
  .icon-btn svg{width:15px;height:15px}

  .meter{margin-top:10px}
  .m-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .m-status{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .m-status.light{color:var(--low)}.m-status.balanced{color:var(--med)}.m-status.over{color:var(--high)}
  .m-index{font-family:var(--mono);font-size:11.5px;color:var(--text-dim)}
  .m-index b{color:var(--text);font-weight:600}
  .bar{height:6px;background:var(--line-soft);border-radius:5px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:5px;transition:width .25s,background .2s}
  .bar>i.light{background:var(--low)}.bar>i.balanced{background:var(--med)}.bar>i.over{background:var(--high)}

  .col-body{padding:7px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:4px}
  .col.drop-hot{outline:2px dashed var(--accent);outline-offset:-4px}
  .row.nest-hot{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft)!important}
  .row.nest-hot .c-name{color:var(--accent)}

  /* Compact client ROW */
  .row{
    display:flex;align-items:center;gap:8px;padding:8px 9px 8px 10px;background:#fff;border:1px solid var(--line-soft);
    border-left:3px solid var(--line);border-radius:8px;cursor:grab;transition:box-shadow .12s,border-color .12s;position:relative;
  }
  .row:hover{box-shadow:0 2px 9px rgba(20,25,35,.09);border-color:#d3d8e1}
  .row.dragging{opacity:.35}
  .drag-clone{position:fixed;z-index:9999;pointer-events:none;margin:0;background:#fff;border-radius:8px;
    box-shadow:0 14px 34px rgba(20,25,35,.30);transform:rotate(1.3deg);opacity:.98;cursor:grabbing}
  .row.Low{border-left-color:var(--low)} .row.Medium{border-left-color:var(--med)} .row.High{border-left-color:var(--high)}
  .row.is-parent{background:#fcfcff}
  .kids{margin:2px 0 2px 16px;padding-left:10px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:4px}
  .kids .row{background:#fbfcfe}
  .kids-count{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--text-dim);background:#eef1f6;border:1px solid var(--line-soft);padding:1px 6px;border-radius:20px;flex:0 0 auto}
  .row.off{background:#f7f8fa;border-left-color:#cfd5de!important}
  .row.off .c-name{text-decoration:line-through}
  .row.off .c-name,.row.off .badges,.row.off .tag{opacity:.45}
  .row.off .c-actions{background:linear-gradient(90deg,rgba(247,248,250,0),#f7f8fa 34%)}
  .off-flag{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.5px;color:#8a93a1;background:#e9edf2;border:1px solid var(--line-soft);padding:2px 6px;border-radius:5px;flex:0 0 auto}
  .c-name{font-weight:600;font-size:13px;line-height:1.3;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badges{display:flex;gap:3px;flex:0 0 auto}
  .pb{width:18px;height:18px;border-radius:5px;font-size:10px;font-weight:700;display:grid;place-items:center;background:#eef1f6;color:#6b7686;border:1px solid #e3e7ee}
  .pb.Meta{background:#eef2ff;color:#3a53c5;border-color:#dde4ff}
  .pb.Google{background:#eafaf0;color:#1f8a4c;border-color:#d6f2e0}
  .pb.TikTok{background:#f1eef4;color:#161616;border-color:#e4e0ea}
  .pb.Snap{background:#fff7dc;color:#8a7000;border-color:#f2e9bf}
  .pb.Linkedin,.pb.LinkedIn{background:#e9f3fb;color:#1668c1;border-color:#d5e8f7}
  .tag{font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:2px 6px;border-radius:5px;flex:0 0 auto;font-family:var(--mono)}
  .tag.Low{background:var(--low-bg);color:var(--low)} .tag.Medium{background:var(--med-bg);color:var(--med)} .tag.High{background:var(--high-bg);color:var(--high)}
  .c-actions{position:absolute;top:0;bottom:0;right:6px;display:flex;align-items:center;gap:0;opacity:0;transition:opacity .12s;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 34%);padding-left:44px;border-radius:0 8px 8px 0}
  .row:hover .c-actions,.row:focus-within .c-actions{opacity:1}
  .c-actions .icon-btn{width:24px;height:24px}

  .add-client{border:1px dashed #cdd3dd;background:transparent;color:var(--text-dim);border-radius:8px;padding:8px;font-size:12.5px;font-weight:600;width:100%;transition:.12s;margin-top:2px}
  .add-client:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .empty-note{color:var(--text-faint);font-size:12px;text-align:center;padding:12px 6px}

  .add-col{flex:0 0 54px;min-width:54px;background:transparent;border:1px dashed #c7cdd8;border-radius:12px;color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:300;transition:.12s}
  .add-col:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(15,18,25,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:92vh;overflow-y:auto;animation:pop .16s ease}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal h3{margin:0;padding:18px 20px 3px;font-size:16px;letter-spacing:-.2px}
  .modal .sub{padding:0 20px 14px;color:var(--text-dim);font-size:12.5px}
  .field{padding:0 20px 14px}
  .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin-bottom:6px}
  .field input[type=text]{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;outline:none}
  .field input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;outline:none;background:#fff;color:var(--text)}
  .field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .plat-grid{display:flex;flex-wrap:wrap;gap:7px}
  .plat-toggle{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--text-dim);transition:.12s}
  .plat-toggle.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .load-choice{display:flex;gap:7px}
  .load-choice button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;font-weight:700;font-size:12.5px;color:var(--text-dim);transition:.12s}
  .load-choice button.on.Low{background:var(--low-bg);border-color:var(--low);color:var(--low)}
  .load-choice button.on.Medium{background:var(--med-bg);border-color:var(--med);color:var(--med)}
  .load-choice button.on.High{background:var(--high-bg);border-color:var(--high);color:var(--high)}
  .modal-foot{display:flex;gap:9px;align-items:center;padding:14px 20px 18px;border-top:1px solid var(--line-soft);margin-top:4px}
  .modal-foot .right{display:flex;gap:9px;margin-left:auto}
  .mbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 15px;font-weight:600;font-size:13px;color:var(--text)}
  .mbtn:hover{background:#f6f7f9}
  .mbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .mbtn.primary:hover{background:#4a46c9}
  .mbtn.danger{color:var(--high);border-color:#f0cfcb}
  .mbtn.danger:hover{background:var(--high-bg)}

  .move-menu{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:5px;min-width:170px;max-height:60vh;overflow:auto;display:none}
  .move-menu.open{display:block}
  .move-menu .mm-head{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);padding:6px 9px 4px}
  .move-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 9px;border-radius:7px;font-size:13px;color:var(--text)}
  .move-menu button:hover{background:var(--accent-soft);color:var(--accent)}
  .move-menu button:disabled{color:var(--text-faint);cursor:default;background:transparent}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:550;opacity:0;pointer-events:none;transition:.2s;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:620px){
    header.topbar{flex-wrap:wrap;height:auto;padding:10px 12px;gap:8px}
    .spacer{display:none}
    .brand{flex:1 1 auto}
    #btnFull{display:none}
    .search{order:4;flex:1 1 100%}
    .search input{width:100%}
    .stats{order:5;width:100%;justify-content:space-between;gap:6px}
    .board{height:auto;min-height:0;flex-direction:column;overflow-x:visible;overflow-y:visible;padding:10px;gap:10px}
    .col{min-width:0;max-height:none;flex:0 0 auto}
    .col-body{overflow:visible}
    .col-tools{opacity:1}
    .add-col{min-height:52px;width:100%}
    body{overflow:auto;overflow-x:hidden}
    input,select,textarea{font-size:16px}
    .row{flex-wrap:wrap;row-gap:8px;padding:11px 12px}
    .c-name{flex:1 1 100%;order:1;white-space:normal;font-size:14px}
    .kids-count{order:2}
    .off-flag{order:3}
    .badges{order:4}
    .tag{order:5}
    .c-actions{position:static;opacity:1;background:none;padding-left:0;order:6;margin-left:auto;gap:2px}
    .c-actions .icon-btn{width:36px;height:36px}
    .icon-btn svg{width:18px;height:18px}
    .col-tools .icon-btn{width:34px;height:34px}
    .tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;-webkit-overflow-scrolling:touch}
    .tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--text-dim);white-space:nowrap;display:flex;align-items:center;gap:6px}
    .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .tab-count{font-family:var(--mono);font-size:10.5px;opacity:.85}
    .tab-add{color:var(--accent);border-color:var(--accent);font-weight:700}
    .col{display:none}
    .col.active{display:flex}
    .board.searching .col{display:flex}
    .add-col{display:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><b>3RDS TEAM</b><span>Client workload</span></div>
  <span id="syncPill" class="sync local">Local only</span>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8b93a3" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Find client…" autocomplete="off">
  </div>
  <button class="btn solid" id="btnFull">⛶ Fullscreen</button>
  <button class="btn" id="btnExport">Backup</button>
  <button class="btn" id="btnImport">Restore</button>
  <button class="btn" id="btnReset">Reset</button>
  <input type="file" id="fileInput" accept="application/json" style="display:none">
</header>

<nav class="tabs" id="tabs"></nav>

<main class="board" id="board"></main>

<div class="overlay" id="clientOverlay">
  <div class="modal">
    <h3 id="clientTitle">Add client</h3>
    <div class="sub" id="clientSub"></div>
    <div class="field"><label>Client name</label>
      <input type="text" id="clientName" placeholder="e.g. Cipriani Dubai" autocomplete="off"></div>
    <div class="field"><label>Platforms</label>
      <div class="plat-grid" id="platGrid"></div>
      <div style="display:flex;gap:7px;margin-top:8px">
        <input type="text" id="platCustom" placeholder="Add another platform…" autocomplete="off">
        <button class="mbtn" id="platAdd" type="button">Add</button>
      </div></div>
    <div class="field"><label>Workload</label>
      <div class="load-choice" id="loadChoice">
        <button type="button" data-load="Low">Low</button>
        <button type="button" data-load="Medium">Medium</button>
        <button type="button" data-load="High">High</button>
      </div></div>
    <div class="field" id="parentField"><label>Group under (optional)</label>
      <select id="clientParent"></select></div>
    <div class="modal-foot">
      <button class="mbtn danger" id="clientDelete" style="display:none">Delete</button>
      <div class="right">
        <button class="mbtn" id="clientCancel">Cancel</button>
        <button class="mbtn primary" id="clientSave">Save</button>
      </div></div>
  </div>
</div>

<div class="move-menu" id="moveMenu"></div>
<div class="toast" id="toast"></div>

let state=load(), filter="", editing=null, activeTab=null;
function uid(){return Math.random().toString(36).slice(2,9)}
function hydrate(raw){raw.members.forEach(m=>{if(!m.id)m.id=uid();m.clients.forEach(c=>{if(!c.id)c.id=uid();});});return raw;}
function load(){try{const s=localStorage.getItem(LS_KEY);if(s)return hydrate(JSON.parse(s));}catch(e){}return hydrate(JSON.parse(JSON.stringify(SEED)));}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}cloudSave();}

/* ---- shared sync engine ---- */
let cloudInit=false,saveTimer=null;
function setSync(s){
  const p=document.getElementById("syncPill");if(!p)return;
  if(!SHARED){p.textContent="Local only";p.className="sync local";return;}
  if(s==="live"){p.textContent="● Shared · Live";p.className="sync live";}
  else if(s==="saving"){p.textContent="Saving…";p.className="sync saving";}
  else{p.textContent="Reconnecting…";p.className="sync off";}
}
function cloudSave(){
  if(!SHARED)return;
  if(USE_FS){ setSync("saving"); if(window.__fsSave) window.__fsSave(JSON.stringify(state)); return; }
  setSync("saving");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    fetch(`${DB_URL}/board.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(state)})
      .then(()=>setSync("live")).catch(()=>setSync("off"));
  },250);
}
function cloudFetch(){
  fetch(`${DB_URL}/board.json`).then(r=>r.json()).then(d=>{if(d&&d.members){state=hydrate(d);try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}render();setSync("live");}}).catch(()=>setSync("off"));
}
function startCloud(){
  if(!SHARED){setSync();return;}
  if(USE_FS){setSync("off");return;}   // Firestore is handled by the module at the bottom
  setSync("off");
  try{
    const es=new EventSource(`${DB_URL}/board.json`);
    es.onopen=()=>setSync("live");
    es.onerror=()=>setSync("off");
    es.addEventListener("put",ev=>{
      let msg;try{msg=JSON.parse(ev.data);}catch(e){return;}
      if(!msg)return;
      if(msg.data==null){ if(!cloudInit){cloudInit=true;cloudSave();} setSync("live"); return; }
      if(msg.path==="/"&&msg.data.members){ state=hydrate(msg.data); try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){} cloudInit=true; render(); setSync("live"); }
      else cloudFetch();
    });
    es.addEventListener("patch",()=>cloudFetch());
  }catch(e){setSync("off");}
}
/* bridge for the Firestore module */
window.applyRemote=function(obj){ if(obj&&obj.members){ state=hydrate(obj); try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){} render(); } };
window.getStateJSON=function(){ return JSON.stringify(state); };
window.getSeedJSON=function(){ return JSON.stringify(hydrate(JSON.parse(JSON.stringify(SEED)))); };
window.setSyncLive=function(){ setSync("live"); };
window.setSyncOff=function(){ setSync("off"); };
function findMember(id){return state.members.find(m=>m.id===id)}
function score(m){return m.clients.reduce((s,c)=>s+(c.active===false?0:(LOAD_W[c.load]||1)),0)}
function toggleActive(memberId,clientId){
  const m=findMember(memberId);if(!m)return;
  const c=m.clients.find(x=>x.id===clientId);if(!c)return;
  c.active=(c.active===false);            // off -> on, on -> off
  save();render();toast(`${c.name} turned ${c.active?"on":"off"}`);
}
function offLast(list){return list.filter(c=>c.active!==false).concat(list.filter(c=>c.active===false));}
function statusFor(sc,avg){if(avg<=0)return"light";const r=sc/avg;if(r>1.15)return"over";if(r<0.85)return"light";return"balanced";}

function addStat(v,l){const d=document.createElement("div");d.className="stat";d.innerHTML=`<b>${v}</b><span>${l}</span>`;statsEl.appendChild(d);}

function rowEl(m,c,kidCount){
  const off=c.active===false;
  const el=document.createElement("div");el.className="row "+c.load+(kidCount?" is-parent":"")+(off?" off":"");el.dataset.id=c.id;

  el.innerHTML=`

function matches(c){if(!filter)return true;const f=filter.toLowerCase();return c.name.toLowerCase().includes(f)||c.platforms.join(" ").toLowerCase().includes(f);}
function cls(p){return p.replace(/[^A-Za-z]/g,"")}
function esc(s){return String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]))}

function moveClient(clientId,toId){
  let from=null;
  for(const m of state.members){if(m.clients.some(c=>c.id===clientId)){from=m;break;}}
  if(!from)return;
  const to=findMember(toId);
  if(!to||to.id===from.id)return;                 // same person: leave grouping as-is
  const ids=[clientId,...from.clients.filter(c=>c.parentId===clientId).map(c=>c.id)];
  const moving=from.clients.filter(c=>ids.includes(c.id));
  from.clients=from.clients.filter(c=>!ids.includes(c.id));
  const root=moving.find(c=>c.id===clientId);if(root)root.parentId=null;
  to.clients.push(...moving);
  save();render();
  toast(`${root?root.name:"Client"}${moving.length>1?` +${moving.length-1}`:""} → ${to.name}`);
}
function nestClient(clientId,targetId){
  if(clientId===targetId)return;
  let from=null,dragged=null,to=null,target=null;
  for(const m of state.members){
    const a=m.clients.find(x=>x.id===clientId);if(a){from=m;dragged=a;}
    const b=m.clients.find(x=>x.id===targetId);if(b){to=m;target=b;}
  }
  if(!dragged||!target)return;
  const parentId=target.parentId?target.parentId:target.id;   // dropping on a child nests under its hotel
  if(parentId===dragged.id)return;                            // can't nest under its own child
  const kids=from.clients.filter(x=>x.parentId===dragged.id);
  if(kids.length){moveClient(clientId,to.id);return;}         // a group can't sit inside another group
  if(from.id===to.id&&dragged.parentId===parentId)return;     // already there
  from.clients=from.clients.filter(x=>x.id!==dragged.id);
  dragged.parentId=parentId;
  to.clients.push(dragged);
  save();render();
  const pName=(to.clients.find(x=>x.id===parentId)||{}).name||"group";
  toast(`${dragged.name} → under ${pName}`);
}

/* Custom drag: floating clone stays on top, never clipped by a column */
let drag=null;
function deleteClient(memberId,clientId){
  const m=findMember(memberId);if(!m)return;
  const c=m.clients.find(x=>x.id===clientId);if(!c)return;
  const kids=m.clients.filter(x=>x.parentId===clientId);
  const msg=kids.length?`Remove ${c.name}? Its ${kids.length} grouped client(s) will move up to top level.`:`Remove ${c.name} from ${m.name}?`;
  if(confirm(msg)){
    kids.forEach(k=>k.parentId=null);
    m.clients=m.clients.filter(x=>x.id!==clientId);save();render();toast(`${c.name} removed`);
  }
}
function startDrag(e,el,clientId,fromId){
  if(e.pointerType!=="mouse")return;              // touch/pen use the ↔ Move menu
  if(e.button!==0)return;                          // left button only
  if(e.target.closest(".c-actions"))return;        // let edit/move buttons work
  const rect=el.getBoundingClientRect();
  drag={el,clientId,fromId,rect,startX:e.clientX,startY:e.clientY,
        offsetX:e.clientX-rect.left,offsetY:e.clientY-rect.top,active:false,clone:null,hotRow:null,hotCol:null};
  window.addEventListener("pointermove",onDragMove);
  window.addEventListener("pointerup",onDragUp,{once:true});
}
function onDragMove(e){
  if(!drag)return;
  if(!drag.active){
    if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<5)return; // ignore tiny moves = click
    drag.active=true;
    const clone=drag.el.cloneNode(true);
    clone.classList.add("drag-clone");
    clone.style.width=drag.rect.width+"px";
    document.body.appendChild(clone);
    drag.clone=clone;
    drag.el.classList.add("dragging");
    document.body.style.userSelect="none";
  }
  e.preventDefault();
  drag.clone.style.left=(e.clientX-drag.offsetX)+"px";
  drag.clone.style.top=(e.clientY-drag.offsetY)+"px";
  const under=document.elementFromPoint(e.clientX,e.clientY);
  const row=under?under.closest(".row"):null;
  const col=under?under.closest(".col"):null;
  const nestRow=(row&&row.dataset.id!==drag.clientId&&!row.classList.contains("dragging"))?row:null;
  if(drag.hotRow&&drag.hotRow!==nestRow){drag.hotRow.classList.remove("nest-hot");drag.hotRow=null;}
  if(drag.hotCol&&(nestRow||drag.hotCol!==col)){drag.hotCol.classList.remove("drop-hot");drag.hotCol=null;}
  if(nestRow){if(drag.hotRow!==nestRow){nestRow.classList.add("nest-hot");drag.hotRow=nestRow;}}
  else if(col){if(drag.hotCol!==col){col.classList.add("drop-hot");drag.hotCol=col;}}
}
function onDragUp(){
  window.removeEventListener("pointermove",onDragMove);
  if(drag&&drag.active){
    const nestRow=drag.hotRow,col=drag.hotCol;
    if(nestRow)nestRow.classList.remove("nest-hot");
    if(col)col.classList.remove("drop-hot");
    if(drag.clone)drag.clone.remove();
    document.body.style.userSelect="";
    if(nestRow&&nestRow.dataset.id)nestClient(drag.clientId,nestRow.dataset.id);
    else if(col&&col.dataset.id)moveClient(drag.clientId,col.dataset.id);
    else drag.el.classList.remove("dragging");
  }
  drag=null;
}

const btnFull=document.getElementById("btnFull");
btnFull.onclick=()=>{if(!document.fullscreenElement){(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement);}else{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}};
document.addEventListener("fullscreenchange",()=>{btnFull.innerHTML=document.fullscreenElement?"⛶ Exit":"⛶ Fullscreen";});

document.getElementById("btnExport").onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="workload-board-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(a.href);toast("Backup downloaded");};
document.getElementById("btnImport").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.members)throw 0;state=hydrate(d);save();render();toast("Board restored");}catch(err){toast("Couldn't read that file");}};rd.readAsText(f);e.target.value="";};
document.getElementById("btnReset").onclick=()=>{if(confirm("Reset to the original team.xlsx data? Current changes will be lost (Backup first if unsure).")){state=hydrate(JSON.parse(JSON.stringify(SEED)));save();render();toast("Reset to original");}};

let toastT;function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1900);}

<script type="module">
(async()=>{
  const cfg=window.__FS_CONFIG;
  if(!cfg||!cfg.projectId)return;
  try{
    const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const {getFirestore,doc,onSnapshot,setDoc}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const db=getFirestore(initializeApp(cfg));
    const ref=doc(db,"board","state");
    let t=null;
    window.__fsSave=(json)=>{clearTimeout(t);t=setTimeout(()=>{setDoc(ref,{json,ts:Date.now()}).then(()=>window.setSyncLive&&window.setSyncLive()).catch(()=>window.setSyncOff&&window.setSyncOff());},250);};
    onSnapshot(ref,(snap)=>{
      if(snap.metadata.hasPendingWrites)return;      // ignore our own just-sent write
      if(!snap.exists()){ const j=window.getSeedJSON&&window.getSeedJSON(); if(j){ window.applyRemote&&window.applyRemote(JSON.parse(j)); window.__fsSave&&window.__fsSave(j); } return; }
      const d=snap.data();
      if(d&&d.json){ try{ window.applyRemote&&window.applyRemote(JSON.parse(d.json)); }catch(e){} }
      window.setSyncLive&&window.setSyncLive();
    },()=>{ window.setSyncOff&&window.setSyncOff(); });
  }catch(e){ window.setSyncOff&&window.setSyncOff(); }
})();
</script>
