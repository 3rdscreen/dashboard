<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ushuaïa Dubai Performance</title>
<style>
  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;}
  button{font:inherit;color:inherit;}
  :root{
    color-scheme:light;
    --paper:#ffffff;--surface:#fbfaf8;--ink:#1c1b19;--muted:#8b867c;--muted2:#a8a297;
    --line:#e8e8e8;--line2:#dcdcdc;--accent:#a01c1c;--accent-d:#8a1717;--accent-soft:#f6eaea;--meta:#1877f2;
  }
  body{background:var(--paper);color:var(--ink);font-family:Calibri,Carlito,Candara,"Segoe UI",system-ui,-apple-system,sans-serif;
       font-size:14.5px;line-height:1.4;-webkit-font-smoothing:antialiased;}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .cur{font-size:12px;font-weight:600;color:var(--muted2);margin-left:2px;letter-spacing:.02em;}

  .sheet{max-width:1080px;margin:0 auto;padding:40px 30px 70px;}
  .mast{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 20px;padding-bottom:14px;border-bottom:2px solid var(--accent);}
  .lockup{display:flex;align-items:center;gap:15px;min-width:0;}
  .logo{height:76px;width:auto;max-width:150px;object-fit:contain;flex:none;display:block;}
  .mast .right{text-align:right;flex:none;}
  .kicker{font-size:12px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);}
  .period{font-size:21.1px;font-weight:700;color:var(--accent);margin-top:2px;}
  .client{margin:0;font-size:35.6px;font-weight:800;letter-spacing:-.02em;line-height:1.02;}
  .subtitle{margin:3px 0 0;font-size:13.9px;color:var(--muted);}

  /* event tabs */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 4px;}
  .tab.done{opacity:.8;}
  .tab{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--paper);border:1px solid var(--line2);
       border-radius:9px;padding:8px 14px;cursor:pointer;text-align:left;transition:border-color .12s,color .12s,background .12s;}
  .tab .tn{font-size:15.5px;font-weight:700;line-height:1.15;}
  .tab .td{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .tab:hover{border-color:var(--accent);color:var(--accent);}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tab[aria-selected="true"] .td{color:#f3d9d9;}

  .slabel{display:flex;align-items:center;gap:10px;margin:26px 0 12px;}
  .slabel .bulb{width:9px;height:9px;border-radius:50%;background:var(--meta);flex:none;}
  .slabel .txt{font-size:12.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);white-space:nowrap;}
  .slabel .rule{flex:1;height:1px;background:var(--line2);}
  .metaline{font-size:12.5px;color:var(--muted);margin:0 0 11px;}
  .pdot{width:8px;height:8px;border-radius:50%;background:var(--meta);display:inline-block;margin:0 3px 0 2px;}

  .evhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin-top:22px;padding-bottom:7px;border-bottom:1px solid var(--line2);}
  .evhead h2{margin:0;font-size:25.1px;font-weight:800;letter-spacing:-.01em;}
  .evhead .sp{margin-left:auto;font-size:12.5px;color:var(--muted);}
  .badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:3px;border:1px solid var(--accent);color:var(--accent);}
  .badge.grey{border-color:var(--line2);color:var(--muted);}

  .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .kpi .card{border:1px solid var(--line);border-radius:7px;padding:11px 12px 12px;}
  .kpi .lbl{font-size:12px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);}
  .kpi .val{font-size:27.7px;font-weight:800;letter-spacing:-.02em;margin-top:6px;}
  .kpi .sub{font-size:12.5px;color:var(--muted);margin-top:3px;}

  table{width:100%;border-collapse:collapse;}
  .tablewrap{overflow-x:auto;}
  th{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:#fff;background:var(--accent);padding:7px 8px;text-align:right;white-space:nowrap;}
  th:first-child{text-align:left;border-radius:5px 0 0 0;}
  th:last-child{border-radius:0 5px 0 0;}
  td{font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  td:first-child{text-align:left;}
  .cell{display:flex;align-items:center;gap:8px;}
  .flag{font-size:15px;line-height:1;width:20px;text-align:center;flex:none;}
  .rowname{font-size:12px;font-weight:600;}
  .dim{color:var(--muted2);}
  tr.total td{font-weight:800;border-top:2px solid var(--accent);border-bottom:none;}
  tr.total td:first-child{color:var(--accent);}
  tbody tr:hover td{background:var(--surface);}
  .note{font-size:11.5px;color:var(--muted);margin-top:10px;}


  /* ============ calendar (same as Be Beach) ============ */
  .calwrap{position:relative;display:inline-block;margin-top:6px;}
  .pill{display:inline-flex;align-items:center;gap:9px;font:inherit;font-size:18.5px;font-weight:700;color:var(--ink);
        background:var(--paper);border:1px solid var(--line2);border-radius:9px;padding:9px 15px;cursor:pointer;}
  .pill:hover{border-color:var(--accent);color:var(--accent);}
  .pill .cal{width:13px;height:13px;flex:none;}
  .pill .caret{font-size:12px;color:var(--muted2);}
  .calpop{position:absolute;z-index:40;top:calc(100% + 10px);right:0;width:648px;max-width:calc(100vw - 24px);background:var(--paper);
          color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 44px rgba(28,27,25,.18);text-align:left;overflow:hidden;}
  .calgrid{display:flex;align-items:stretch;}
  .presets{width:186px;flex:none;border-right:1px solid var(--line);max-height:352px;overflow-y:auto;overflow-x:hidden;}
  .preslist{padding:5px 0;}
  .preslist button{display:block;width:100%;text-align:left;font:inherit;font-size:12px;font-weight:600;color:var(--ink);
          background:transparent;border:0;padding:7px 14px;cursor:pointer;border-left:3px solid transparent;line-height:1.3;}
  .preslist button .sub{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;}
  .preslist button:hover{background:var(--accent-soft);}
  .preslist button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-left-color:var(--accent);font-weight:700;}
  .preslist button[disabled]{opacity:.4;cursor:default;background:transparent;}
  .calmain{flex:1;min-width:0;display:flex;flex-direction:column;}
  .dateboxes{display:flex;align-items:center;gap:8px;padding:11px 14px 8px;}
  .datebox{flex:1;min-width:0;text-align:left;font:inherit;background:var(--paper);border:1px solid var(--line2);border-radius:7px;padding:5px 10px;cursor:pointer;}
  .datebox .dbl{display:block;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .datebox .dbv{display:block;font-size:12.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .datebox[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
  .dbdash{color:var(--muted2);font-size:16px;flex:none;}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 14px 4px;}
  .dow span{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:3px 0;}
  .months{overflow-y:auto;max-height:262px;padding:0 14px 10px;}
  .monblock{margin-bottom:10px;}
  .monblock .mon{font-size:11.5px;font-weight:700;color:var(--ink);text-align:center;padding:4px 0 6px;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .day{font:inherit;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;height:27px;border:0;background:transparent;color:var(--ink);cursor:pointer;border-radius:999px;}
  .day:hover:not([disabled]){background:var(--accent-soft);color:var(--accent);}
  .day.mid{background:var(--accent-soft);color:var(--accent);border-radius:0;}
  .day.end{background:var(--accent);color:#fff;font-weight:800;}
  .day.s0{border-radius:999px 0 0 999px;}
  .day.s1{border-radius:0 999px 999px 0;}
  .day.solo{border-radius:999px;}
  .day[disabled]{color:var(--muted2);opacity:.35;cursor:default;}
  .day.blank{visibility:hidden;}
  .calfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .calfoot .hint{font-size:11px;color:var(--muted);}
  .calbtns{display:flex;gap:8px;margin-left:auto;}
  .btn{font:inherit;font-size:12px;font-weight:700;padding:6px 15px;border-radius:7px;cursor:pointer;border:1px solid var(--line2);background:var(--paper);color:var(--ink);}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d);color:#fff;}
  footer{margin-top:44px;padding:14px 0 34px;border-top:1px solid var(--line2);display:flex;flex-wrap:wrap;gap:8px 20px;
         justify-content:space-between;align-items:baseline;font-size:10.5px;letter-spacing:.04em;color:var(--muted);}
  footer b{color:var(--accent);font-weight:700;}
  footer .stamp{color:var(--muted2);}

  @media (max-width:760px){
    .kpi{grid-template-columns:repeat(2,1fr);}
    .calpop{width:min(360px,calc(100vw - 24px));right:auto;left:0;}
    .calgrid{flex-direction:column;}
    .presets{width:100%;max-height:none;border-right:0;border-bottom:1px solid var(--line);}
    .preslist{display:flex;gap:6px;overflow-x:auto;padding:8px 0;}
    .preslist button{width:auto;white-space:nowrap;padding:6px 11px;border-left:0;border-radius:999px;border:1px solid var(--line2);margin-left:6px;}
    .preslist button[aria-pressed="true"]{border-color:var(--accent);}
    .mast .right{text-align:left;}
    .calwrap{width:100%;}
    .pill{width:100%;justify-content:center;font-size:16px;}
  }
  @media (max-width:600px){
    .sheet{padding:22px 14px 50px;}
    .logo{height:50px;}
    .client{font-size:27px;}
    .period{font-size:17px;}
    .kicker{font-size:10px;}
    .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-right:-14px;}
    .tab{flex:none;padding:7px 11px;}
    .tab .tn{font-size:14px;}
    .evhead h2{font-size:21px;}
    .evhead .sp{margin-left:0;width:100%;}
    .kpi .val{font-size:22px;}
    .kpi .lbl{font-size:10.5px;}
    td,th{font-size:11px;padding:6px 6px;}
  }
</style>
</head>

    var r=presetRange(p[0],c);
    return '<button type="button" data-k="'+p[0]+'" aria-pressed="'+(draft.preset===p[0])+'"'+(r?'':' disabled')+'>'+p[1]+'<span class="sub">'+(r?rangeLabel(r[0],r[1]):"No data")+'</span></button>';
  }).join("");
  $("dbStartV").textContent=draft.from?fd(draft.from):"—";
  $("dbEndV").textContent=draft.to?fd(draft.to):"—";
  $("dbStart").setAttribute("aria-pressed",picking==="start");$("dbEnd").setAttribute("aria-pressed",picking==="end");
  $("calHint").textContent="Season 3 · spend from "+fd(b.lo);
  var h="",m=new Date(b.lo.slice(0,8)+"01T12:00:00"),last=b.hi.slice(0,7);
  var FULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
  while(iso(m).slice(0,7)<=last){
    var y=m.getFullYear(),mo=m.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate();
    h+='<div class="monblock"><div class="mon">'+FULL[mo]+' '+y+'</div><div class="grid">';
    for(var k=0;k<first;k++)h+='<button class="day blank" tabindex="-1"></button>';
    for(var d=1;d<=days;d++){
      var ds=y+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"),cls="day",dis=ds<b.lo||ds>b.hi;
      if(draft.from&&draft.to&&ds>=draft.from&&ds<=draft.to){
        if(ds===draft.from&&ds===draft.to)cls+=" end solo";
        else if(ds===draft.from)cls+=" end s0";
        else if(ds===draft.to)cls+=" end s1";
        else cls+=" mid";
      }else if(draft.from&&!draft.to&&ds===draft.from)cls+=" end solo";
      h+='<button type="button" class="'+cls+'" data-d="'+ds+'"'+(dis?' disabled':'')+'>'+d+'</button>';
    }
    h+='</div></div>';
    m.setMonth(m.getMonth()+1);
  }
  var box=$("calMonths");box.innerHTML=h;
  if(scroll){var e=box.querySelector('[data-d="'+(draft.to||b.hi)+'"]');if(e)box.scrollTop=Math.max(0,e.offsetTop-box.offsetTop-150)}
}
function bindCal(){
  $("periodBtn").onclick=function(e){e.stopPropagation();if($("calPop").hidden)openCal();else closeCal()};
  $("calPop").addEventListener("click",function(e){
    e.stopPropagation();
    var p=e.target.closest("[data-k]");
    if(p&&!p.disabled){var r=presetRange(p.dataset.k,cur);if(r){sel={preset:p.dataset.k,from:r[0],to:r[1]};closeCal();render()}return}
    var d=e.target.closest("[data-d]");
    if(d&&!d.disabled){
      var ds=d.dataset.d;
      if(picking==="start"||!draft.from){draft.from=ds;draft.to=null;picking="end"}
      else{if(ds<draft.from){draft.to=draft.from;draft.from=ds}else draft.to=ds;picking="start"}
      draft.preset="custom";drawCal(false);return;
    }
    if(e.target.closest("#dbStart")){picking="start";drawCal(false);return}
    if(e.target.closest("#dbEnd")){picking="end";drawCal(false);return}
    if(e.target.closest("#calCancel")){closeCal();return}
    if(e.target.closest("#calApply")){
      if(draft.from){sel={preset:draft.preset,from:draft.from,to:draft.to||draft.from}}
      closeCal();render();
    }
  });
  document.addEventListener("click",function(){if(!$("calPop").hidden)closeCal()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("calPop").hidden)closeCal()});
}

function render(){
  tabs();
  var c=cur,sales=c.kind==="sales";
  applySel(c);
  var full=isFull(c),D=getData(c);
  $("periodLabel").textContent=rangeLabel(sel.from,sel.to);
  $("stamp").textContent="Meta data to "+fd(S.until);
  var b=bounds(c);
  var h='<div class="evhead"><h2>'+esc(c.t)+(c.ev?' – '+fd(c.ev):'')+'</h2>'+status(c)
       +'<span class="sp">'+(sales?"Purchase campaign":"Sign-up campaign")+' · live '+fs(b.lo)+' – '+fs(b.hi)+'</span></div>';
  h+='<div class="slabel"><span class="bulb"></span><span class="txt">Campaign overview</span><span class="rule"></span></div>';
  h+='<div class="kpi">';
  var reach=full?card("Reach",n0(D.r),"frequency "+(div(D.i,D.r)).toFixed(2)):card("Reach","—","full period only");
  if(sales){
    h+=card("Amount spent",cm(D.s))+card("Purchases",n0(D.p))+card("Cost per purchase",cm(div(D.s,D.p),2))+card("Revenue",cm(D.pv))
      +card("ROAS",roas(div(D.pv,D.s)))+card("Impressions",n0(D.i),"CPM "+tm(div(D.s,D.i)*1000,2))+reach+card("Clicks",n0(D.k),"CTR "+pct(div(D.k,D.i))+" · CPC "+tm(div(D.s,D.k),2));
  }else{
    h+=card("Amount spent",cm(D.s))+card("Sign-ups",n0(D.l))+card("Cost per sign-up",cm(div(D.s,D.l),2))+card("CTR",pct(div(D.k,D.i)))
      +card("Impressions",n0(D.i),"CPM "+tm(div(D.s,D.i)*1000,2))+reach+card("Clicks",n0(D.k),"CPC "+tm(div(D.s,D.k),2))+card("Purchases",n0(D.p),"after signing up");
  }
  h+='</div>';
  h+='<div class="slabel"><span class="bulb"></span><span class="txt">Breakdown by countries</span><span class="rule"></span></div>';
  if(!D.rows.length){h+='<p class="metaline">No spend in this date range.</p>';$("app").innerHTML=h;return}
  h+='<div class="tablewrap"><table><thead><tr><th>Country</th><th>Spend</th><th>Share</th><th>Impressions</th><th>Clicks</th><th>CTR</th>'
    +(sales?'<th>Purchases</th><th>Cost / purchase</th><th>Revenue</th><th>ROAS</th>':'<th>Sign-ups</th><th>Cost / sign-up</th>')+'</tr></thead><tbody>';
  var T={s:0,i:0,k:0,p:0,pv:0,l:0};
  D.rows.forEach(function(r){
    T.s+=r.s;T.i+=r.i;T.k+=r.k;T.p+=r.p;T.pv+=r.pv;T.l+=r.l;
    h+='<tr><td><span class="cell"><span class="flag">'+flag(r.cc)+'</span><span class="rowname">'+esc(cname(r.cc))+'</span></span></td>'
      +'<td>'+tm(r.s)+'</td><td>'+share(div(r.s,D.s))+'</td><td>'+n0(r.i)+'</td><td>'+n0(r.k)+'</td><td>'+pct(div(r.k,r.i))+'</td>'
      +(sales?'<td>'+n0(r.p)+'</td><td>'+(r.p?tm(div(r.s,r.p),2):'<span class="dim">—</span>')+'</td><td>'+tm(r.pv)+'</td><td>'+roas(div(r.pv,r.s))+'</td>'
             :'<td>'+n0(r.l)+'</td><td>'+(r.l?tm(div(r.s,r.l),2):'<span class="dim">—</span>')+'</td>')+'</tr>';
  });
  h+='<tr class="total"><td>Total</td><td>'+tm(T.s)+'</td><td>100%</td><td>'+n0(T.i)+'</td><td>'+n0(T.k)+'</td><td>'+pct(div(T.k,T.i))+'</td>'
    +(sales?'<td>'+n0(T.p)+'</td><td>'+tm(div(T.s,T.p),2)+'</td><td>'+tm(T.pv)+'</td><td>'+roas(div(T.pv,T.s))+'</td>':'<td>'+n0(T.l)+'</td><td>'+tm(div(T.s,T.l),2)+'</td>')+'</tr>';
  h+='</tbody></table></div>';
  $("app").innerHTML=h;
}
function fromHash(){var h=(location.hash||"").slice(1);return EV.filter(function(c){return slug(c)===h})[0]}
cur=fromHash()||defaultEv();
bindCal();
window.addEventListener("hashchange",function(){var c=fromHash();if(c&&c!==cur){cur=c;render()}});
render();
})();
</script>
</body>
